workflow_spec_version: 2
id: memory_extractor.turn
description: PostTurn memory workflow; receives explicit post_turn_ctx via agent_task ($runtime.post_turn.ctx → $start.user_prompt).
meta:
  transcript_mode: summary
nodes:
  receive:
    use: on_receive
  extract:
    use: structured_memory_extract
    input: $start.user_prompt
    depends_on:
      - receive
  done:
    use: noop
    input: $nodes.extract
    depends_on:
      - extract
end: done
