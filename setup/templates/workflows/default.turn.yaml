workflow_spec_version: 2
id: default.turn
description: Main turn v2 workflow.
nodes:
  receive:
    use: on_receive
    input: $start.user_prompt
  main:
    use: llm
    prompt: $start.user_prompt
  respond:
    use: on_respond
    input: $nodes.main
  memory_agent:
    use: agent_task
    async: true
    agent_type: memory_extractor
    input: $runtime.post_turn.ctx
    depends_on:
      - respond
  skill_agent:
    use: agent_task
    async: true
    agent_type: skill_generator
    input: $runtime.post_turn.ctx
    depends_on:
      - respond
end: respond
